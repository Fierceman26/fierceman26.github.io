<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

  <script>
    // State Architecture
    const state = {
      pattern: 'alt',     // 'alt' (3-0-3-0) or 'prbs'
      channel: 'ideal',   // 'ideal' or 'real'
      fmax: 112,          // cutoff frequency in GHz (30 - 224)
      energy: 90.3,       // calculated percentage
      hoverX: null,
      hoverPanel: null
    };

    // Helper to extract resolved Lumi design token colors in Canvas 2D
    function getCssVar(name) {
      if (!name) return '#000000';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim() || '#888888';
    }

    // PRBS7 static seed vector for consistent eye generation
    const PRBS_SYMBOLS = [];
    (function generatePRBS() {
      let lfsr = 0x7F;
      for (let i = 0; i < 500; i++) {
        const bit1 = (lfsr >> 6) & 1;
        const bit2 = (lfsr >> 5) & 1;
        const newBit = bit1 ^ bit2;
        lfsr = ((lfsr << 1) & 0x7F) | newBit;
        const sym = (lfsr & 0x03); // PAM4 level 0, 1, 2, 3
        PRBS_SYMBOLS.push(sym);
      }
    })();

    // Analytical energy calculation function for sinc^2 spectrum
    function calculateEnergyCaptured(fmax) {
      // Integration of sinc^2(f/112) from 0 to fmax normalized by integral to infinity (56 GHz)
      const steps = 300;
      const df = fmax / steps;
      let sum = 0;
      for (let i = 0; i < steps; i++) {
        const f = (i + 0.5) * df;
        const x = (Math.PI * f) / 112;
        const sinc = Math.sin(x) / x;
        sum += sinc * sinc * df;
      }
      // Total spectrum integral from 0 to 500 GHz
      const totalSteps = 1000;
      const totalDf = 500 / totalSteps;
      let totalSum = 0;
      for (let i = 0; i < totalSteps; i++) {
        const f = (i + 0.5) * totalDf;
        const x = (Math.PI * f) / 112;
        const sinc = Math.sin(x) / x;
        totalSum += sinc * sinc * totalDf;
      }
      return Math.min(99.9, Math.max(10.0, (sum / totalSum) * 100));
    }

    // Dynamic Sinc Low-Pass Filter Kernel
    function filterSignalPoint(symbols, t_ui, fmax, channelType) {
      const UI_ps = 8.92857; // 1 UI in ps
      const t = t_ui;
      let val = 0;
      let weightSum = 0;

      const windowRange = 8; // UI window
      const currentIndex = Math.floor(t);

      for (let i = currentIndex - windowRange; i <= currentIndex + windowRange; i++) {
        const symIndex = (i % symbols.length + symbols.length) % symbols.length;
        const symLevel = symbols[symIndex];
        const nominalVoltage = (symLevel - 1.5) / 1.5; // Scale -1.0 to +1.0

        const timeDiff_ps = (t - (i + 0.5)) * UI_ps;
        const f_cutoff = fmax / 1000; // GHz to THz (1/ps)
        
        let kernel = 1;
        if (timeDiff_ps === 0) {
          kernel = 2 * f_cutoff * UI_ps;
        } else {
          const x = 2 * Math.PI * f_cutoff * timeDiff_ps;
          kernel = Math.sin(x) / (Math.PI * timeDiff_ps) * UI_ps;
        }

        // Apply channel dispersion / loss attenuation if real PCB model selected
        if (channelType === 'real') {
          const rollOff = Math.exp(-Math.abs(timeDiff_ps) * 0.12 * (1 - fmax/300));
          kernel *= rollOff;
        }

        val += nominalVoltage * kernel;
        weightSum += Math.abs(kernel);
      }

      return val;
    }

    // Viewport HiDPI Canvas setup helper
    function prepareCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return null;
      const box = canvas.parentElement;
      const w = box.clientWidth || 300;
      const h = box.clientHeight || 150;
      const dpr = window.devicePixelRatio || 1;
      
      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { canvas, ctx, w, h };
    }

    // Render Time Domain Viewport
    function renderTimeDomain() {
      const res = prepareCanvas('timeCanvas');
      if (!res) return;
      const { ctx, w, h } = res;

      const bgColor = getCssVar('--surface-bright');
      const textColor = getCssVar('--on-surface');
      const textSubColor = getCssVar('--on-surface-variant');
      const gridColor = getCssVar('--on-surface-low');
      const strokeWave = getCssVar('--chart-1');
      const strokeRef = getCssVar('--chart-3');
      const sampleColor = getCssVar('--error');

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);

      const margin = { top: 24, right: 20, bottom: 32, left: 36 };
      const plotW = w - margin.left - margin.right;
      const plotH = h - margin.top - margin.bottom;
      const centerY = margin.top + plotH / 2;

      // Draw Grid & Axes
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      // Voltage levels (PAM4 3, 2, 1, 0 -> +1, +0.33, -0.33, -1)
      [-1, -0.33, 0, 0.33, 1].forEach(v => {
        const y = centerY - v * (plotH / 2.6);
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + plotW, y);
      });
      ctx.stroke();

      // UI Time scale: Show 8 UIs
      const numUI = 8;
      const dx = plotW / numUI;

      // UI vertical tick lines
      ctx.strokeStyle = gridColor;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      for (let i = 0; i <= numUI; i++) {
        const x = margin.left + i * dx;
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, margin.top + plotH);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // Select Pattern sequence
      let patternSymbols = [];
      if (state.pattern === 'alt') {
        patternSymbols = [3, 0, 3, 0, 3, 0, 3, 0, 3, 0];
      } else {
        patternSymbols = PRBS_SYMBOLS.slice(0, 10);
      }

      // Draw 56 GHz Reference Sine Wave (Period = 2 UI)
      ctx.strokeStyle = strokeRef;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      for (let px = 0; px <= plotW; px += 2) {
        const t_ui = (px / plotW) * numUI;
        // 56 GHz has period of 2 UI
        const refVal = Math.sin(Math.PI * t_ui);
        const y = centerY - refVal * (plotH / 2.6);
        if (px === 0) ctx.moveTo(margin.left + px, y);
        else ctx.lineTo(margin.left + px, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Draw Filtered Waveform
      ctx.strokeStyle = strokeWave;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let px = 0; px <= plotW; px += 2) {
        const t_ui = (px / plotW) * numUI;
        const val = filterSignalPoint(patternSymbols, t_ui, state.fmax, state.channel);
        const y = centerY - val * (plotH / 2.6);
        if (px === 0) ctx.moveTo(margin.left + px, y);
        else ctx.lineTo(margin.left + px, y);
      }
      ctx.stroke();

      // Draw 112 GSps ADC Sampling Points (1 Point / UI at optimal phase center = 0.5 UI)
      for (let i = 0; i < numUI; i++) {
        const t_ui = i + 0.5;
        const x = margin.left + (t_ui / numUI) * plotW;
        const val = filterSignalPoint(patternSymbols, t_ui, state.fmax, state.channel);
        const y = centerY - val * (plotH / 2.6);

        ctx.fillStyle = sampleColor;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = bgColor;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Time & Voltage Axis Labels
      ctx.fillStyle = textSubColor;
      ctx.font = '11px var(--ff-mono)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let i = 0; i <= numUI; i += 2) {
        const x = margin.left + i * dx;
        const time_ps = (i * 8.93).toFixed(1);
        ctx.fillText(`${time_ps}ps`, x, margin.top + plotH + 4);
      }

      // Label 1 UI & 1 Fundamental Period (2 UI) Ruler
      const rY = margin.top + 10;
      const x1 = margin.left + 2 * dx;
      const x2 = margin.left + 3 * dx;
      const x3 = margin.left + 4 * dx;

      ctx.strokeStyle = textColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, rY); ctx.lineTo(x2, rY);
      ctx.moveTo(x1, rY - 3); ctx.lineTo(x1, rY + 3);
      ctx.moveTo(x2, rY - 3); ctx.lineTo(x2, rY + 3);
      ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.font = '10px var(--ff-sans)';
      ctx.fillText('1 UI (8.93ps)', (x1 + x2) / 2, rY - 12);

      ctx.strokeStyle = strokeRef;
      ctx.beginPath();
      ctx.moveTo(x1, rY + 14); ctx.lineTo(x3, rY + 14);
      ctx.moveTo(x1, rY + 11); ctx.lineTo(x1, rY + 17);
      ctx.moveTo(x3, rY + 11); ctx.lineTo(x3, rY + 17);
      ctx.stroke();
      ctx.fillStyle = strokeRef;
      ctx.fillText('56GHz 基波周期 (2 UI)', (x1 + x3) / 2, rY + 16);
    }

    // Render Frequency Domain Viewport
    function renderFreqDomain() {
      const res = prepareCanvas('freqCanvas');
      if (!res) return;
      const { ctx, w, h } = res;

      const bgColor = getCssVar('--surface-bright');
      const textSubColor = getCssVar('--on-surface-variant');
      const gridColor = getCssVar('--on-surface-low');
      const envColor = getCssVar('--chart-1');
      const highlightBg = getCssVar('--accent-container');
      const strokeHighlight = getCssVar('--accent-fixed');
      const markColor = getCssVar('--error');

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);

      const margin = { top: 24, right: 20, bottom: 32, left: 36 };
      const plotW = w - margin.left - margin.right;
      const plotH = h - margin.top - margin.bottom;

      const maxFreq = 250; // GHz
      const fmax = state.fmax;

      // Draw Highlighted Extraction Window [0, fmax]
      const winW = (fmax / maxFreq) * plotW;
      ctx.fillStyle = highlightBg;
      ctx.globalAlpha = 0.5;
      ctx.fillRect(margin.left, margin.top, winW, plotH);
      ctx.globalAlpha = 1.0;

      ctx.strokeStyle = strokeHighlight;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(margin.left + winW, margin.top);
      ctx.lineTo(margin.left + winW, margin.top + plotH);
      ctx.stroke();
      ctx.setLineDash([]);

      // Grid Lines
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      [0, 56, 112, 168, 224].forEach(f => {
        const x = margin.left + (f / maxFreq) * plotW;
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, margin.top + plotH);
      });
      ctx.stroke();

      // Theoretical sinc^2 Envelope Line
      ctx.strokeStyle = envColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let px = 0; px <= plotW; px += 2) {
        const f = (px / plotW) * maxFreq;
        if (f === 0) {
          ctx.moveTo(margin.left + px, margin.top + 4);
          continue;
        }
        const x = (Math.PI * f) / 112;
        const sinc = Math.sin(x) / x;
        const psd = sinc * sinc; // 0 to 1
        const y = margin.top + plotH * (1 - psd * 0.9);
        ctx.lineTo(margin.left + px, y);
      }
      ctx.stroke();

      // Discrete Harmonics Spectrum Bars for 3-0-3-0 Pattern (Discrete harmonics at 56, 168, 280)
      if (state.pattern === 'alt') {
        [56, 168, 224].forEach(f => {
          if (f <= maxFreq) {
            const x = margin.left + (f / maxFreq) * plotW;
            const x_sinc = (Math.PI * f) / 112;
            const amp = Math.pow(Math.sin(x_sinc) / x_sinc, 2);
            const y = margin.top + plotH * (1 - amp * 0.9);

            ctx.strokeStyle = (f <= fmax) ? markColor : textSubColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, margin.top + plotH);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Point head
            ctx.fillStyle = (f <= fmax) ? markColor : textSubColor;
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, 2 * Math.PI);
            ctx.fill();
          }
        });
      }

      // X Axis Frequency Labels & Markers
      ctx.fillStyle = textSubColor;
      ctx.font = '10px var(--ff-mono)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      const keyFreqs = [
        { f: 0, label: '0' },
        { f: 56, label: '56G (f_N)' },
        { f: 112, label: '112G (1st 0)' },
        { f: 168, label: '168G (3rd)' },
        { f: 224, label: '224G' }
      ];

      keyFreqs.forEach(item => {
        const x = margin.left + (item.f / maxFreq) * plotW;
        ctx.fillText(item.label, x, margin.top + plotH + 4);
      });
    }

    // Render PAM4 3-Eye Diagram Viewport
    function renderEyeDiagram() {
      const res = prepareCanvas('eyeCanvas');
      if (!res) return;
      const { ctx, w, h } = res;

      const bgColor = getCssVar('--surface-bright');
      const textSubColor = getCssVar('--on-surface-variant');
      const gridColor = getCssVar('--on-surface-low');
      const traceColor = getCssVar('--chart-1');

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);

      const margin = { top: 16, right: 24, bottom: 24, left: 36 };
      const plotW = w - margin.left - margin.right;
      const plotH = h - margin.top - margin.bottom;
      const centerY = margin.top + plotH / 2;

      // Draw Grid & Nominal PAM4 Decision Thresholds
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      // Nominal PAM4 levels: +1, +0.33, -0.33, -1
      [-1, -0.33, 0, 0.33, 1].forEach(v => {
        const y = centerY - v * (plotH / 2.5);
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + plotW, y);
      });
      ctx.stroke();

      // Fold 2-UI segments from PRBS sequence
      const numTraces = 60;
      const traceLengthUI = 2.0;

      ctx.strokeStyle = traceColor;
      ctx.globalAlpha = 0.18; // High-density fluorescent superposition
      ctx.lineWidth = 1.8;

      for (let n = 0; n < numTraces; n++) {
        const startIndex = n * 2;
        ctx.beginPath();
        const steps = 40;
        for (let s = 0; s <= steps; s++) {
          const relUI = (s / steps) * traceLengthUI;
          const globalUI = startIndex + relUI;
          const val = filterSignalPoint(PRBS_SYMBOLS, globalUI, state.fmax, state.channel);
          const px = margin.left + (relUI / traceLengthUI) * plotW;
          const py = centerY - val * (plotH / 2.5);
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;

      // Eye height calculation based on cutoff frequency fmax
      let eyeOpening = 0;
      if (state.fmax < 56) {
        eyeOpening = Math.max(0, (state.fmax - 30) / 26 * 35); // severely closed
      } else if (state.fmax <= 112) {
        eyeOpening = 35 + ((state.fmax - 56) / 56) * 51.5; // opening smoothly to 86.5%
      } else {
        eyeOpening = Math.min(96.0, 86.5 + ((state.fmax - 112) / 112) * 9.5);
      }

      if (state.channel === 'real') {
        eyeOpening *= 0.78; // Penalty for real channel residual ISI
      }

      state.eyeHeight = eyeOpening.toFixed(1);
      document.getElementById('eye-height-val').textContent = `${state.eyeHeight}%`;

      // Status Badge text logic
      const statusValEl = document.getElementById('overshoot-val');
      if (state.fmax < 56) {
        if (statusValEl) statusValEl.textContent = '严重失真 / 无法开眼 (带宽不足)';
      } else if (state.fmax < 112) {
        if (statusValEl) statusValEl.textContent = '边沿平缓 / 眼睛部分张开';
      } else if (state.fmax <= 168) {
        if (statusValEl) statusValEl.textContent = '陡峭跳变 / 三眼清晰张开 (推荐)';
      } else {
        if (statusValEl) statusValEl.textContent = '高频吉布斯振铃过冲 (过度仿真)';
      }

      // X Axis UI Labels
      ctx.fillStyle = textSubColor;
      ctx.font = '10px var(--ff-mono)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('0 UI', margin.left, margin.top + plotH + 4);
      ctx.fillText('1 UI (8.93ps)', margin.left + plotW / 2, margin.top + plotH + 4);
      ctx.fillText('2 UI (17.86ps)', margin.left + plotW, margin.top + plotH + 4);
    }

    // Unified render dispatcher
    function updateViz() {
      state.energy = calculateEnergyCaptured(state.fmax);
      document.getElementById('energy-val').textContent = `${state.energy.toFixed(1)}%`;

      renderTimeDomain();
      renderFreqDomain();
      renderEyeDiagram();
    }

    // Interactive Control Bindings & Listeners
    function initControls() {
      // Pattern toggle
      document.querySelectorAll('[data-pattern]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('[data-pattern]').forEach(b => {
            b.classList.remove('is-selected');
            b.setAttribute('aria-checked', 'false');
            b.setAttribute('tabindex', '-1');
          });
          e.currentTarget.classList.add('is-selected');
          e.currentTarget.setAttribute('aria-checked', 'true');
          e.currentTarget.setAttribute('tabindex', '0');
          state.pattern = e.currentTarget.dataset.pattern;
          updateViz();
        });
      });

      // Channel model toggle
      document.querySelectorAll('[data-channel]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('[data-channel]').forEach(b => {
            b.classList.remove('is-selected');
            b.setAttribute('aria-checked', 'false');
            b.setAttribute('tabindex', '-1');
          });
          e.currentTarget.classList.add('is-selected');
          e.currentTarget.setAttribute('aria-checked', 'true');
          e.currentTarget.setAttribute('tabindex', '0');
          state.channel = e.currentTarget.dataset.channel;
          updateViz();
        });
      });

      // Cutoff slider
      const slider = document.getElementById('fmax-slider');
      const valBadge = document.getElementById('fmax-slider-val');

      slider.addEventListener('input', (e) => {
        const fval = parseFloat(e.target.value);
        state.fmax = fval;
        if (valBadge) valBadge.textContent = `${fval} GHz`;
        
        const pct = (fval - slider.min) / (slider.max - slider.min) * 100;
        slider.style.setProperty('--progress', pct + '%');

        // Sync preset selection buttons highlight
        document.querySelectorAll('[data-fmax]').forEach(b => {
          if (parseFloat(b.dataset.fmax) === fval) {
            b.classList.add('is-selected');
          } else {
            b.classList.remove('is-selected');
          }
        });

        updateViz();
      });

      // Cutoff presets buttons
      document.querySelectorAll('[data-fmax]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const fval = parseFloat(e.currentTarget.dataset.fmax);
          state.fmax = fval;
          slider.value = fval;
          if (valBadge) valBadge.textContent = `${fval} GHz`;

          const pct = (fval - slider.min) / (slider.max - slider.min) * 100;
          slider.style.setProperty('--progress', pct + '%');

          document.querySelectorAll('[data-fmax]').forEach(b => b.classList.remove('is-selected'));
          e.currentTarget.classList.add('is-selected');

          updateViz();
        });
      });

      // Keyboard navigation for segmented groups
      document.querySelectorAll('.lumi-segmented-group').forEach(group => {
        group.addEventListener('keydown', (e) => {
          const buttons = Array.from(group.querySelectorAll('.lumi-segmented-btn'));
          const activeIdx = buttons.findIndex(b => b.getAttribute('aria-checked') === 'true');
          if (activeIdx === -1) return;

          let nextIdx = activeIdx;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            nextIdx = (activeIdx + 1) % buttons.length;
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            nextIdx = (activeIdx - 1 + buttons.length) % buttons.length;
          }

          if (nextIdx !== activeIdx) {
            e.preventDefault();
            buttons[nextIdx].click();
            buttons[nextIdx].focus();
          }
        });
      });

      // Window Resize Listener
      window.addEventListener('resize', () => {
        updateViz();
      });
    }

    // Initialization
    initControls();
    updateViz();

    // Luminous Theme & Auto-Resize Standard Handlers
    const applyTheme = t => { 
      document.documentElement.setAttribute('data-theme', t); 
      if (typeof updateViz === 'function') updateViz(); 
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => { 
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme); 
    });
    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        /* widget resize message removed for sandbox */;
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});document.addEventListener('change',function(e){f(e.target);});window.addEventListener('message',function(e){var d=e&&e.data;if(d&&(d.type==='SUPPLEMENTAL_DATA_UPDATE'||d.type==='RESTORE_STATE')){all();setTimeout(all,0);setTimeout(all,50);}});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){all();setTimeout(all,0);});else{all();setTimeout(all,0);}})();</script>
