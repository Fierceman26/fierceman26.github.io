<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

  <script>
    // Pure utility: token resolver
    function getCssVar(name) {
      if (!name) return '';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
    }

    // Physical constants
    const Rs = 112.0; // GBaud
    const UI_ps = 1000.0 / Rs; // 8.92857 ps per UI
    const fNyquist = Rs / 2.0; // 56 GHz
    const symbols = [1, -1, 1, 1]; // Bipolar symbols for [1, 0, 1, 1]

    // Reactive State
    const state = {
      B: 56.0,          // GHz
      targetB: 56.0,
      alpha: 0.0,       // Roll-off factor [0, 1]
      targetAlpha: 0.0,
      hoverX: null,     // Mouse state
      hoverY: null,
      animating: false
    };

    // Canvas element handles
    let canvas, ctx;

    // Raised Cosine / Sinc Impulse Response Definition
    // h(t) where t is in UI units. B_norm = B / fNyquist
    function pulseResponse(t_ui, B_norm, alpha) {
      // Scale normalized time by bandwidth ratio relative to Nyquist
      const u = t_ui * B_norm; 
      
      // Sinc part
      let sincVal = 1.0;
      if (Math.abs(u) > 1e-7) {
        const piU = Math.PI * u;
        sincVal = Math.sin(piU) / piU;
      }

      // Roll-off filtering part
      if (alpha <= 0.001) {
        return sincVal;
      }

      const denom = 1.0 - Math.pow(2.0 * alpha * u, 2);
      if (Math.abs(denom) < 1e-5) {
        // L'Hopital's limit near denominator zero
        return (Math.PI / 4.0) * sincVal;
      }

      const cosVal = Math.cos(Math.PI * alpha * u);
      return sincVal * (cosVal / denom);
    }

    // Calculate total ISI distortion percentage at integer UI grid points
    function calculateISI(B_norm, alpha) {
      let totalInterference = 0.0;
      // Evaluate adjacent UI points from -4 UI to +4 UI (excluding 0)
      for (let k = -5; k <= 5; k++) {
        if (k === 0) continue;
        const val = pulseResponse(k, B_norm, alpha);
        totalInterference += Math.abs(val);
      }
      return totalInterference * 100.0; // Percentage
    }

    // Main Canvas Render Loop
    function drawSimulation() {
      if (!canvas || !ctx) return;

      const container = document.getElementById('canvas-wrapper');
      const w = container.clientWidth || 600;
      const h = container.clientHeight || 340;
      const dpr = window.devicePixelRatio || 1;

      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      // Resolve theme colors
      const colorBg = getCssVar('--surface-bright') || '#ffffff';
      const colorDim = getCssVar('--surface-dim') || '#f2f0f0';
      const colorText = getCssVar('--on-surface') || '#000000';
      const colorTextMuted = getCssVar('--on-surface-variant') || '#666666';
      const colorStroke = getCssVar('--stroke-default') || '#e3e3e3';
      const colorPrimary = getCssVar('--primary') || '#3186ff';
      const colorPositive = getCssVar('--positive') || '#008052';
      const colorError = getCssVar('--error') || '#de2d29';
      
      const chartColors = [
        getCssVar('--chart-1') || '#2575fc',
        getCssVar('--chart-2') || '#5b6e9e',
        getCssVar('--chart-3') || '#228a49',
        getCssVar('--chart-4') || '#62991b'
      ];

      const B_norm = state.B / fNyquist;
      const alpha = state.alpha;

      // Split Viewport into Top and Bottom regions
      const padLeft = 45;
      const padRight = 20;
      const topHeight = Math.floor(h * 0.46);
      const botHeight = Math.floor(h * 0.46);
      const topY = 24;
      const botY = topY + topHeight + 20;

      const plotWidth = w - padLeft - padRight;

      // Section Titles
      ctx.fillStyle = colorText;
      ctx.font = "600 12px 'Google Sans Flex', sans-serif";
      ctx.textAlign = 'left';
      ctx.fillText("单脉冲过零点验证  h(t) = sinc(2Bt) · RC(α)", padLeft, topY - 8);
      ctx.fillText("多符号叠加接收信号  y(t) = Σ a_k · h(t - k·UI)", padLeft, botY - 8);

      // Common X scale: from -3.5 UI to +5.5 UI
      const uiMin = -3.2;
      const uiMax = 5.2;
      const xToPx = (ui) => padLeft + ((ui - uiMin) / (uiMax - uiMin)) * plotWidth;
      const pxToUi = (px) => uiMin + ((px - padLeft) / plotWidth) * (uiMax - uiMin);

      // Helper to draw Viewport Axes & Grid
      function drawGraphBox(yTop, height, titleYZero) {
        ctx.fillStyle = colorDim;
        ctx.fillRect(padLeft, yTop, plotWidth, height);
        ctx.strokeStyle = colorStroke;
        ctx.lineWidth = 1;
        ctx.strokeRect(padLeft, yTop, plotWidth, height);

        // Center zero line
        ctx.beginPath();
        ctx.strokeStyle = colorStroke;
        ctx.lineWidth = 1.5;
        ctx.moveTo(padLeft, titleYZero);
        ctx.lineTo(padLeft + plotWidth, titleYZero);
        ctx.stroke();

        // UI Grid Lines & Labels
        ctx.font = "11px 'Google Sans Code', monospace";
        ctx.textAlign = 'center';
        for (let u = Math.ceil(uiMin); u <= Math.floor(uiMax); u++) {
          const gx = xToPx(u);
          ctx.beginPath();
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = (u === 0) ? colorPrimary : colorStroke;
          ctx.moveTo(gx, yTop);
          ctx.lineTo(gx, yTop + height);
          ctx.stroke();
          ctx.setLineDash([]);

          // Grid labels
          ctx.fillStyle = colorTextMuted;
          if (yTop === topY) {
            ctx.fillText(`${u > 0 ? '+' : ''}${u} UI`, gx, yTop + height - 4);
          } else {
            ctx.fillText(`k=${u}`, gx, yTop + height - 4);
          }
        }
      }

      // TOP VIEW Y-Scale: Voltage from -0.4 to 1.2
      const topZeroY = topY + topHeight * (1.2 / 1.6);
      const topValToY = (v) => topZeroY - (v * (topHeight / 1.6));
      drawGraphBox(topY, topHeight, topZeroY);

      // Draw Top Single Pulse h(t)
      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = colorPrimary;
      for (let px = padLeft; px <= padLeft + plotWidth; px += 1.5) {
        const u = pxToUi(px);
        const val = pulseResponse(u, B_norm, alpha);
        const py = topValToY(val);
        if (px === padLeft) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Top Zero-crossing Sample Dots (at integer UIs)
      const isPerfectZero = Math.abs(state.B - 56.0) < 0.2;
      for (let u = Math.ceil(uiMin); u <= Math.floor(uiMax); u++) {
        const val = pulseResponse(u, B_norm, alpha);
        const dotX = xToPx(u);
        const dotY = topValToY(val);

        ctx.beginPath();
        ctx.arc(dotX, dotY, (u === 0) ? 5 : 4, 0, Math.PI * 2);
        if (u === 0) {
          ctx.fillStyle = colorPrimary;
        } else {
          ctx.fillStyle = isPerfectZero ? colorPositive : colorError;
        }
        ctx.fill();
        ctx.strokeStyle = colorBg;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // BOTTOM VIEW Y-Scale: Voltage from -1.8 to 1.8
      const botZeroY = botY + botHeight * 0.5;
      const botValToY = (v) => botZeroY - (v * (botHeight / 3.6));
      drawGraphBox(botY, botHeight, botZeroY);

      // Draw Individual Symbol Pulses & Sum Waveform
      const numSamples = Math.floor(plotWidth);
      const sumWaveform = new Float32Array(numSamples + 1);

      // Draw individual symbol components (faint dashed lines)
      symbols.forEach((sym, idx) => {
        const centerUi = idx; // 0, 1, 2, 3
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = chartColors[idx % chartColors.length];
        ctx.lineWidth = 1.2;

        for (let i = 0; i <= numSamples; i++) {
          const px = padLeft + i;
          const u = pxToUi(px);
          const val = sym * pulseResponse(u - centerUi, B_norm, alpha);
          sumWaveform[i] += val;
          const py = botValToY(val);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Draw Sum Waveform (bold solid curve)
      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = colorText;
      for (let i = 0; i <= numSamples; i++) {
        const px = padLeft + i;
        const py = botValToY(sumWaveform[i]);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Sample Decision Points on Received Waveform
      symbols.forEach((sym, idx) => {
        const sampleUi = idx;
        const samplePx = xToPx(sampleUi);
        let sampleVal = 0;
        symbols.forEach((s, sIdx) => {
          sampleVal += s * pulseResponse(sampleUi - sIdx, B_norm, alpha);
        });

        const dotY = botValToY(sampleVal);
        const err = Math.abs(sampleVal - sym);

        // Vertical error stick to ideal level
        const idealY = botValToY(sym);
        if (err > 0.02) {
          ctx.beginPath();
          ctx.setLineDash([2, 2]);
          ctx.strokeStyle = colorError;
          ctx.lineWidth = 2;
          ctx.moveTo(samplePx, idealY);
          ctx.lineTo(samplePx, dotY);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Sampling dot
        ctx.beginPath();
        ctx.arc(samplePx, dotY, 5, 0, Math.PI * 2);
        ctx.fillStyle = (err < 0.05) ? colorPositive : colorError;
        ctx.fill();
        ctx.strokeStyle = colorBg;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Target target badge
        ctx.fillStyle = colorTextMuted;
        ctx.font = "10px 'Google Sans Code', monospace";
        ctx.textAlign = 'center';
        ctx.fillText(`Target: ${sym > 0 ? '+1' : '-1'}V`, samplePx, idealY + (sym > 0 ? -8 : 14));
      });

      // Hover Crosshair Interactivity
      if (state.hoverX !== null && state.hoverX >= padLeft && state.hoverX <= padLeft + plotWidth) {
        const hoverUi = pxToUi(state.hoverX);
        const hoverPs = (hoverUi * UI_ps).toFixed(1);

        // Calculate sum at hover UI
        let totalV = 0;
        symbols.forEach((s, sIdx) => {
          totalV += s * pulseResponse(hoverUi - sIdx, B_norm, alpha);
        });

        // Draw hover vertical line
        ctx.beginPath();
        ctx.setLineDash([2, 2]);
        ctx.strokeStyle = colorText;
        ctx.lineWidth = 1;
        ctx.moveTo(state.hoverX, topY);
        ctx.lineTo(state.hoverX, botY + botHeight);
        ctx.stroke();
        ctx.setLineDash([]);

        // Update HUD
        const hud = document.getElementById('hud');
        hud.style.display = 'block';
        document.getElementById('hud-time').textContent = `时间 t: ${hoverPs} ps (${hoverUi.toFixed(2)} UI)`;
        document.getElementById('hud-val').textContent = `合成电压: ${totalV.toFixed(2)} V`;
      } else {
        document.getElementById('hud').style.display = 'none';
      }

      ctx.restore();
    }

    // Interactive Dispatcher
    function updateViz() {
      // Synchronize KPI values
      const isiVal = calculateISI(state.B / fNyquist, state.alpha);
      const isiElem = document.getElementById('kpi-isi');
      const badgeElem = document.getElementById('kpi-status-badge');

      if (isiElem) isiElem.textContent = `${isiVal.toFixed(1)} %`;

      if (badgeElem) {
        if (isiVal < 0.1) {
          if (badgeElem) badgeElem.textContent = "Zero ISI";
          badgeElem.className = "badge-pill badge-positive";
        } else if (isiVal < 15.0) {
          if (badgeElem) badgeElem.textContent = "微弱串扰";
          badgeElem.className = "badge-pill badge-positive";
        } else {
          if (badgeElem) badgeElem.textContent = "重度串扰 (ISI)";
          badgeElem.className = "badge-pill badge-error";
        }
      }

      drawSimulation();
    }

    // Presets handler
    function selectPreset(bVal, alphaVal, btn) {
      state.targetB = bVal;
      state.targetAlpha = alphaVal;

      // Update chip UI active states
      document.querySelectorAll('.preset-deck .lumi-chip').forEach(chip => {
        const isActive = chip === btn || parseFloat(chip.dataset.b) === bVal;
        chip.classList.toggle('is-active', isActive);
        chip.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });

      startSmoothTransition();
    }

    // Smooth animation on preset click
    function startSmoothTransition() {
      if (state.animating) return;
      state.animating = true;

      function step() {
        const diffB = state.targetB - state.B;
        const diffA = state.targetAlpha - state.alpha;

        if (Math.abs(diffB) < 0.1 && Math.abs(diffA) < 0.01) {
          state.B = state.targetB;
          state.alpha = state.targetAlpha;
          state.animating = false;
          syncSliderUI();
          updateViz();
          return;
        }

        state.B += diffB * 0.2;
        state.alpha += diffA * 0.2;
        syncSliderUI();
        updateViz();
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function syncSliderUI() {
      const sliderB = document.getElementById('slider-b');
      const sliderBVal = document.getElementById('slider-b-val');
      if (sliderB) {
        sliderB.value = Math.round(state.B);
        const pctB = (sliderB.value - sliderB.min) / (sliderB.max - sliderB.min) * 100;
        sliderB.style.setProperty('--progress', pctB + '%');
      }
      if (sliderBVal) sliderBVal.textContent = `${Math.round(state.B)} GHz`;

      const sliderAlpha = document.getElementById('slider-alpha');
      const sliderAlphaVal = document.getElementById('slider-alpha-val');
      if (sliderAlpha) {
        sliderAlpha.value = state.alpha.toFixed(2);
        const pctA = (sliderAlpha.value - sliderAlpha.min) / (sliderAlpha.max - sliderAlpha.min) * 100;
        sliderAlpha.style.setProperty('--progress', pctA + '%');
      }
      if (sliderAlphaVal) sliderAlphaVal.textContent = state.alpha.toFixed(2);
    }

    // Event listeners setup
    function initEvents() {
      const sliderB = document.getElementById('slider-b');
      const sliderAlpha = document.getElementById('slider-alpha');
      const wrapper = document.getElementById('canvas-wrapper');

      sliderB.addEventListener('input', (e) => {
        state.B = parseFloat(e.target.value);
        state.targetB = state.B;
        const pct = (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100;
        e.target.style.setProperty('--progress', pct + '%');
        document.getElementById('slider-b-val').textContent = `${e.target.value} GHz`;

        // Clear active presets if customized
        document.querySelectorAll('.preset-deck .lumi-chip').forEach(c => {
          const isMatch = parseFloat(c.dataset.b) === state.B;
          c.classList.toggle('is-active', isMatch);
          c.setAttribute('aria-pressed', isMatch ? 'true' : 'false');
        });

        updateViz();
      });

      sliderAlpha.addEventListener('input', (e) => {
        state.alpha = parseFloat(e.target.value);
        state.targetAlpha = state.alpha;
        const pct = (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100;
        e.target.style.setProperty('--progress', pct + '%');
        document.getElementById('slider-alpha-val').textContent = parseFloat(e.target.value).toFixed(2);
        updateViz();
      });

      // Mouse Hover crosshair
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        state.hoverX = e.clientX - rect.left;
        state.hoverY = e.clientY - rect.top;
        updateViz();
      });

      canvas.addEventListener('mouseleave', () => {
        state.hoverX = null;
        state.hoverY = null;
        updateViz();
      });

      window.addEventListener('resize', () => {
        updateViz();
      });
    }

    // Initialization Entrypoint
    function init() {
      canvas = document.getElementById('simCanvas');
      if (canvas) ctx = canvas.getContext('2d');
      initEvents();
      syncSliderUI();
      updateViz();
    }

    // Run when ready
    init();

    // Luminous Theme & Auto-resize Contract
    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
        applyTheme(e.data.theme);
      }
    });
    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        /* widget resize message removed for sandbox */;
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});document.addEventListener('change',function(e){f(e.target);});window.addEventListener('message',function(e){var d=e&&e.data;if(d&&(d.type==='SUPPLEMENTAL_DATA_UPDATE'||d.type==='RESTORE_STATE')){all();setTimeout(all,0);setTimeout(all,50);}});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){all();setTimeout(all,0);});else{all();setTimeout(all,0);}})();</script>


<script id="preset-click-delegate">
document.addEventListener('click', function (event) {
  var btn = event.target && event.target.closest ? event.target.closest('[data-b]') : null;
  if (!btn || typeof selectPreset !== 'function') return;
  var bandwidth = parseFloat(btn.getAttribute('data-b'));
  if (!isFinite(bandwidth)) return;
  selectPreset(bandwidth, 0.0, btn);
});
</script>
