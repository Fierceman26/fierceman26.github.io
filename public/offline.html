<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fafaf6" />
    <title>离线 — FIERCEMAN</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #fafaf6;
        color: #15161a;
        font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
        line-height: 1.65;
        padding: calc(2.5rem + env(safe-area-inset-top, 0px)) max(1.35rem, env(safe-area-inset-right, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px)) max(1.35rem, env(safe-area-inset-left, 0px));
      }
      main { max-width: 36rem; }
      p.kicker {
        font-family: -apple-system, "PingFang SC", sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7a1631;
        margin: 0 0 1rem;
      }
      h1 {
        font-weight: 600;
        font-size: 2rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 1rem;
      }
      p { margin: 0 0 0.9rem; color: #2c2d32; font-size: 1.05rem; }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; margin-top: 1.6rem; }
      a {
        color: #7a1631;
        font-family: -apple-system, "PingFang SC", sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        border-bottom: 1px solid #7a1631;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">FIERCEMAN · JOURNAL</p>
      <h1>这一页还没缓存。</h1>
      <p>当前没有网络。已经打开过的文章、栏目和关于页可以继续读；这一篇还没有在这台设备上打开过。</p>
      <p lang="en">You are offline. Pages you have already opened — in Chinese or English — are still on this device. This one is not.</p>
      <nav>
        <a href="/">中文首页</a>
        <a href="/en/">English home</a>
      </nav>
    </main>
    <script>
      (function () {
        var standalone = window.navigator.standalone === true
          || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!standalone) return;
        document.addEventListener('click', function (event) {
          if (event.defaultPrevented || event.button !== 0) return;
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
          if (!link) return;
          var url;
          try { url = new URL(link.href, location.href); } catch (err) { return; }
          if (url.origin !== location.origin) return;
          event.preventDefault();
          location.href = url.href;
        }, true);
      })();
    </script>
  </body>
</html>
